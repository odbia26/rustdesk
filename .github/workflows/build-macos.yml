name: Build macOS DMG

on:
  workflow_dispatch:
    inputs:
      build-profile:
        description: 'Version a compilar (cliente: solo entrante con PIN | operador: bidireccional completo)'
        required: true
        type: choice
        default: 'cliente'
        options:
          - cliente
          - operador
      arch:
        description: 'Arquitectura de Mac'
        required: true
        type: choice
        default: 'arm64 (Apple Silicon M1/M2/M3/M4)'
        options:
          - 'arm64 (Apple Silicon M1/M2/M3/M4)'
          - 'x86_64 (Intel)'

permissions:
  contents: read

env:
  VERSION: "1.5.1"
  MAC_RUST_VERSION: "1.81"
  FLUTTER_VERSION: "3.24.5"
  FLUTTER_MACOS_ARM_VERSION: "3.44.9"
  CARGO_EXPAND_VERSION: "1.0.95"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"

jobs:
  generate-bridge:
    name: Generate Flutter Rust Bridge
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install prerequisites
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang \
            cmake \
            curl \
            gcc \
            git \
            g++ \
            libclang-dev \
            libgtk-3-dev \
            llvm-dev \
            nasm \
            ninja-build \
            pkg-config \
            wget

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.75"
          targets: x86_64-unknown-linux-gnu
          components: "rustfmt"

      - name: Install flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ inputs.arch == 'x86_64 (Intel)' && '3.22.3' || '3.44.8' }}
          cache: true

      - name: Install flutter rust bridge deps
        shell: bash
        run: |
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          if [ "${{ inputs.arch }}" == "x86_64 (Intel)" ]; then
            sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          else
            bash .github/patches/apply_flutter_3.44_source_patches.sh
          fi
          pushd flutter && flutter pub get && popd

      - name: Run flutter rust bridge
        run: |
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      - name: Upload Bridge Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bridge-artifact-macos
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart
            ./flutter/macos/Runner/bridge_generated.h
            ./flutter/ios/Runner/bridge_generated.h

  build-macos:
    name: Build macOS DMG (${{ inputs.build-profile }})
    needs: [generate-bridge]
    runs-on: ${{ inputs.arch == 'x86_64 (Intel)' && 'macos-13' || 'macos-14' }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Apply Build Profile (${{ inputs.build-profile }})
        shell: bash
        run: |
          python3 .github/scripts/apply_profile.py "${{ inputs.build-profile }}"

      - name: Restore bridge files
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact-macos
          path: ./

      - name: Install build runtime
        shell: bash
        run: |
          brew install llvm create-dmg
          if ! command -v pkg-config &>/dev/null; then
            brew install pkg-config
          fi

      - name: Install flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ inputs.arch == 'x86_64 (Intel)' && env.FLUTTER_VERSION || env.FLUTTER_MACOS_ARM_VERSION }}

      - name: Configure Flutter for macOS
        shell: bash
        run: |
          if [ "${{ inputs.arch }}" != "x86_64 (Intel)" ]; then
            flutter config --no-enable-swift-package-manager
            brew install gnu-sed
            export PATH="$(brew --prefix gnu-sed)/libexec/gnubin:$PATH"
            bash .github/patches/apply_flutter_3.44_source_patches.sh
          else
            cd "$(dirname "$(dirname "$(which flutter)")")"
            git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff || true
          fi
          
          # Scheduler binding fix
          cd "$(dirname "$(which flutter)")"
          sed -i -e 's/_setFramesEnabledState(false);/\/\/_setFramesEnabledState(false);/g' ../packages/flutter/lib/src/scheduler/binding.dart || true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.MAC_RUST_VERSION }}
          targets: ${{ inputs.arch == 'x86_64 (Intel)' && 'x86_64-apple-darwin' || 'aarch64-apple-darwin' }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ${{ inputs.arch == 'x86_64 (Intel)' && 'macos-13' || 'macos-14' }}

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        shell: bash
        run: |
          if ! $VCPKG_ROOT/vcpkg install --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi

      - name: Build Boersis macOS app
        shell: bash
        run: |
          if [ "${{ inputs.arch }}" != "x86_64 (Intel)" ]; then
            MIN_MACOS_VERSION="12.3"
            sed -i -e "s/MACOSX_DEPLOYMENT_TARGET\=[0-9]*.[0-9]*/MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}/" build.py
            sed -i -e "s/platform :osx, '.*'/platform :osx, '${MIN_MACOS_VERSION}'/" flutter/macos/Podfile
            sed -i -e "s/osx_minimum_system_version = \"[0-9]*.[0-9]*\"/osx_minimum_system_version = \"${MIN_MACOS_VERSION}\"/" Cargo.toml
            sed -i -e "s/MACOSX_DEPLOYMENT_TARGET = [0-9]*.[0-9]*;/MACOSX_DEPLOYMENT_TARGET = ${MIN_MACOS_VERSION};/" flutter/macos/Runner.xcodeproj/project.pbxproj
            export MACOSX_DEPLOYMENT_TARGET="${MIN_MACOS_VERSION}"
            ./build.py --flutter --hwcodec --unix-file-copy-paste --screencapturekit
          else
            ./build.py --flutter --hwcodec --unix-file-copy-paste
          fi

      - name: Create Boersis DMG installer
        shell: bash
        run: |
          CREATE_DMG="$(command -v create-dmg)"
          CREATE_DMG="$(readlink -f "$CREATE_DMG")"
          sed -i -e 's/MAXIMUM_UNMOUNTING_ATTEMPTS=3/MAXIMUM_UNMOUNTING_ATTEMPTS=7/' "$CREATE_DMG" || true

          TARGET_ARCH="${{ inputs.arch == 'x86_64 (Intel)' && 'x86_64' || 'arm64' }}"
          DMG_FILE="Boersis-Remote-Desktop-${{ inputs.build-profile }}-${TARGET_ARCH}.dmg"
          
          create-dmg \
            --volname "Boersis Remote Desktop" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "RustDesk.app" 200 190 \
            --hide-extension "RustDesk.app" \
            --app-drop-link 600 185 \
            "$DMG_FILE" \
            ./flutter/build/macos/Build/Products/Release/RustDesk.app

          ls -lh "$DMG_FILE"

      - name: Upload Boersis macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: Boersis-Remote-Desktop-${{ inputs.build-profile }}-${{ inputs.arch == 'x86_64 (Intel)' && 'x86_64' || 'arm64' }}-dmg
          path: Boersis-Remote-Desktop-${{ inputs.build-profile }}-*.dmg
          if-no-files-found: error
