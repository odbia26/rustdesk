name: Build macOS DMG

on:
  workflow_dispatch:
    inputs:
      build-profile:
        description: 'Version a compilar (cliente: solo entrante con PIN | operador: bidireccional completo)'
        required: true
        type: choice
        default: 'cliente'
        options:
          - cliente
          - operador

permissions:
  contents: read

env:
  VERSION: "1.5.1"
  MAC_RUST_VERSION: "1.81"
  FLUTTER_MACOS_ARM_VERSION: "3.44.9"
  CARGO_EXPAND_VERSION: "1.0.95"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  generate-bridge:
    name: Generate Flutter Rust Bridge
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install prerequisites
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang \
            cmake \
            curl \
            gcc \
            git \
            g++ \
            libclang-dev \
            libgtk-3-dev \
            llvm-dev \
            nasm \
            ninja-build \
            pkg-config \
            wget

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.75"
          targets: x86_64-unknown-linux-gnu
          components: "rustfmt"

      - name: Install flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.44.8"
          cache: true

      - name: Install flutter rust bridge deps
        shell: bash
        run: |
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          bash .github/patches/apply_flutter_3.44_source_patches.sh
          pushd flutter && flutter pub get && popd

      - name: Run flutter rust bridge
        run: |
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      - name: Upload Bridge Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bridge-artifact-macos
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart
            ./flutter/macos/Runner/bridge_generated.h
            ./flutter/ios/Runner/bridge_generated.h

  build-macos:
    name: Build macOS DMG (${{ inputs.build-profile }})
    needs: [generate-bridge]
    runs-on: macos-15
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Apply Build Profile (${{ inputs.build-profile }})
        shell: bash
        run: |
          python3 .github/scripts/apply_profile.py "${{ inputs.build-profile }}"

      - name: Restore bridge files
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact-macos
          path: ./

      - name: Install build runtime
        shell: bash
        run: |
          brew install llvm create-dmg gnu-sed
          if ! command -v pkg-config &>/dev/null; then
            brew install pkg-config
          fi
          echo "$(brew --prefix gnu-sed)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Install NASM
        shell: bash
        run: |
          sudo mkdir -p /usr/local/bin /opt/homebrew/bin
          curl -L --retry 3 -o nasm.zip https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip
          unzip -q -o nasm.zip
          chmod +x nasm-2.16.03/nasm
          sudo cp -f nasm-2.16.03/nasm /usr/local/bin/nasm || true
          sudo cp -f nasm-2.16.03/nasm /opt/homebrew/bin/nasm || true
          echo "$PWD/nasm-2.16.03" >> "$GITHUB_PATH"
          export PATH="$PWD/nasm-2.16.03:$PATH"
          nasm --version

      - name: Install flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_MACOS_ARM_VERSION }}

      - name: Configure Flutter for macOS
        shell: bash
        run: |
          flutter config --no-enable-swift-package-manager
          bash .github/patches/apply_flutter_3.44_source_patches.sh
          
          # Pre-resolve Flutter dependencies
          pushd flutter && flutter pub get && popd

          # Scheduler binding fix
          cd "$(dirname "$(which flutter)")"
          sed -i -e 's/_setFramesEnabledState(false);/\/\/_setFramesEnabledState(false);/g' ../packages/flutter/lib/src/scheduler/binding.dart || true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.MAC_RUST_VERSION }}
          targets: aarch64-apple-darwin
          components: "rustfmt"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: macos-15

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        shell: bash
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: arm64-osx
        run: |
          if ! $VCPKG_ROOT/vcpkg install --triplet arm64-osx --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi

      - name: Build Boersis macOS app
        shell: bash
        run: |
          python3 .github/scripts/set_macos_deployment_target.py "12.3"
          export MACOSX_DEPLOYMENT_TARGET="12.3"
          echo "MACOSX_DEPLOYMENT_TARGET=12.3" >> "$GITHUB_ENV"
          ./build.py --flutter --hwcodec --unix-file-copy-paste --screencapturekit

          APP_DIR="./flutter/build/macos/Build/Products/Release"
          if [ -d "$APP_DIR/RustDesk.app" ]; then
            # Ensure "Boersis Remote Desktop" binary exists alongside "RustDesk" for launchd plists
            ln -sf "RustDesk" "$APP_DIR/RustDesk.app/Contents/MacOS/Boersis Remote Desktop" || true
            rm -rf "$APP_DIR/Boersis Remote Desktop.app"
            cp -R "$APP_DIR/RustDesk.app" "$APP_DIR/Boersis Remote Desktop.app"
          fi

      - name: Create Boersis DMG installer
        shell: bash
        run: |
          CREATE_DMG_PATH=$(python3 -c "import os, shutil; p = shutil.which('create-dmg'); print(os.path.realpath(p) if p else '')")
          if [ -n "$CREATE_DMG_PATH" ] && [ -f "$CREATE_DMG_PATH" ]; then
            sed -i -e 's/MAXIMUM_UNMOUNTING_ATTEMPTS=3/MAXIMUM_UNMOUNTING_ATTEMPTS=7/' "$CREATE_DMG_PATH" || true
          fi

          DMG_FILE="Boersis-Remote-Desktop-${{ inputs.build-profile }}-arm64.dmg"
          rm -f "$DMG_FILE"

          APP_DIR="./flutter/build/macos/Build/Products/Release"
          APP_NAME="Boersis Remote Desktop.app"
          if [ ! -d "$APP_DIR/$APP_NAME" ]; then
            APP_NAME="RustDesk.app"
          fi

          create-dmg \
            --volname "Boersis Remote Desktop" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "$APP_NAME" 200 190 \
            --hide-extension "$APP_NAME" \
            --app-drop-link 600 185 \
            "$DMG_FILE" \
            "$APP_DIR/$APP_NAME" || true

          if [ ! -f "$DMG_FILE" ]; then
            echo "create-dmg not produced, fallback to native hdiutil"
            DMG_STAGING="dmg_staging"
            rm -rf "$DMG_STAGING"
            mkdir -p "$DMG_STAGING"
            cp -R "$APP_DIR/$APP_NAME" "$DMG_STAGING/"
            ln -s /Applications "$DMG_STAGING/Applications"
            hdiutil create -volname "Boersis Remote Desktop" -srcfolder "$DMG_STAGING" -ov -format UDZO "$DMG_FILE"
            rm -rf "$DMG_STAGING"
          fi

          ls -lh "$DMG_FILE"

      - name: Upload Boersis macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: Boersis-Remote-Desktop-${{ inputs.build-profile }}-arm64-dmg
          path: Boersis-Remote-Desktop-${{ inputs.build-profile }}-arm64.dmg
          if-no-files-found: error
