name: Build Windows EXE

on:
  workflow_dispatch:
    inputs:
      build-profile:
        description: 'Version a compilar (cliente: solo entrante con PIN | operador: bidireccional completo)'
        required: true
        type: choice
        default: 'cliente'
        options:
          - cliente
          - operador

permissions:
  contents: read

env:
  VERSION: "1.5.1"
  RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  BRIDGE_FLUTTER_VERSION: "3.22.3"
  CARGO_EXPAND_VERSION: "1.0.95"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  generate-bridge:
    name: Generate Flutter Rust Bridge
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install prerequisites
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang \
            cmake \
            curl \
            gcc \
            git \
            g++ \
            libclang-dev \
            libgtk-3-dev \
            llvm-dev \
            nasm \
            ninja-build \
            pkg-config \
            wget

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-unknown-linux-gnu
          components: "rustfmt"

      - name: Install flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.BRIDGE_FLUTTER_VERSION }}
          cache: true

      - name: Install flutter rust bridge deps
        shell: bash
        run: |
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          pushd flutter && flutter pub get && popd

      - name: Run flutter rust bridge
        run: |
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      - name: Upload Bridge Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bridge-artifact
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart
            ./flutter/macos/Runner/bridge_generated.h
            ./flutter/ios/Runner/bridge_generated.h

  build-windows:
    name: Build Windows EXE (${{ inputs.build-profile }})
    needs: [generate-bridge]
    runs-on: windows-2022
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Apply Build Profile (${{ inputs.build-profile }})
        shell: bash
        run: |
          python3 .github/scripts/apply_profile.py "${{ inputs.build-profile }}"

      - name: Restore bridge files
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        id: flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Replace engine with rustdesk custom flutter engine
        shell: bash
        run: |
          echo "=== 1. Locating Flutter SDK ==="
          FLUTTER_BIN=$(which flutter)
          echo "Flutter binary: $FLUTTER_BIN"
          FLUTTER_ROOT=$(dirname $(dirname "$FLUTTER_BIN"))
          echo "Flutter SDK root: $FLUTTER_ROOT"

          echo "=== 2. Pre-caching Windows artifacts ==="
          flutter doctor -v || true
          flutter precache --windows

          echo "=== 3. Downloading RustDesk Custom Engine ==="
          curl -L --retry 3 -o windows-x64-release.zip https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip

          echo "=== 4. Extracting Custom Engine ==="
          unzip -q -o windows-x64-release.zip -d custom-engine

          echo "=== 5. Installing Custom Engine into Flutter SDK ==="
          DEST1="$FLUTTER_ROOT/bin/cache/artifacts/engine/windows-x64-release"
          DEST2="$FLUTTER_ROOT/bin/cache/artifacts/engine/windows-x64"
          mkdir -p "$DEST1"
          mkdir -p "$DEST2"
          cp -rf custom-engine/* "$DEST1/"
          cp -rf custom-engine/* "$DEST2/"

          echo "=== 6. Engine files installed successfully ==="
          ls -la "$DEST1"

      - name: Patch flutter
        shell: bash
        run: |
          echo "=== Applying Flutter Menu Patch ==="
          FLUTTER_ROOT=$(dirname $(dirname $(which flutter)))
          cp -f .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff "$FLUTTER_ROOT/"
          cd "$FLUTTER_ROOT"
          git apply --ignore-whitespace flutter_3.24.4_dropdown_menu_enableFilter.diff || git apply -v flutter_3.24.4_dropdown_menu_enableFilter.diff || true
          echo "Flutter patch applied."

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: windows-2022

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        shell: bash
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          if ! $VCPKG_ROOT/vcpkg install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build rustdesk
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'
          python .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          
          New-Item -ItemType Directory -Force -Path ./rustdesk | Out-Null
          Copy-Item -Path ./flutter/build/windows/x64/runner/Release/* -Destination ./rustdesk/ -Recurse -Force

          # Download usbmmidd_v2.zip and extract it to ./rustdesk
          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath . -Force
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat" -Force -ErrorAction SilentlyContinue
          Copy-Item -Path .\usbmmidd_v2 -Destination ./rustdesk/ -Recurse -Force

          # Download printer driver files (optional)
          try {
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/rustdesk_printer_driver_v4-1.4.zip -OutFile rustdesk_printer_driver_v4-1.4.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/printer_driver_adapter.zip -OutFile printer_driver_adapter.zip
            Expand-Archive rustdesk_printer_driver_v4-1.4.zip -DestinationPath . -Force
            New-Item -ItemType Directory -Force -Path ./rustdesk/drivers/RustDeskPrinterDriver | Out-Null
            Copy-Item -Path .\rustdesk_printer_driver_v4-1.4\* -Destination ./rustdesk/drivers/RustDeskPrinterDriver/ -Recurse -Force
            Expand-Archive printer_driver_adapter.zip -DestinationPath . -Force
            Copy-Item -Path .\printer_driver_adapter.dll -Destination ./rustdesk/ -Force
          } catch {
            Write-Host "Ignoring optional printer driver download error: $_"
          }

      - name: Build WindowInjection dll
        shell: powershell
        run: |
          if (-not (Test-Path "RustDeskTempTopMostWindow")) {
            git clone https://github.com/rustdesk-org/RustDeskTempTopMostWindow RustDeskTempTopMostWindow
          }
          Push-Location RustDeskTempTopMostWindow
          git checkout ecd8d6a139eee76845ea66423fb739af450fda90
          msbuild WindowInjection\WindowInjection.vcxproj -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10
          Pop-Location
          Copy-Item ./RustDeskTempTopMostWindow/WindowInjection/x64/Release/WindowInjection.dll ./rustdesk/ -Force

      - name: Find Runner.res
        continue-on-error: true
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res" 2>/dev/null | head -n 1)
          if [ -n "$runner_res" ]; then
            echo "Runner.res found at: $runner_res"
            mkdir -p ./libs/portable
            cp -f "$runner_res" ./libs/portable/Runner.res
          fi

      - name: Build self-extracted executable
        shell: bash
        run: |
          echo "=== Building portable self-extracted packer ==="
          sed -i '/dpiAware/d' res/manifest.xml || true
          pushd ./libs/portable
          python -m pip install -r requirements.txt || pip install -r requirements.txt
          python ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/rustdesk.exe
          popd
          mkdir -p ./SignOutput
          if [ -f "./target/release/rustdesk-portable-packer.exe" ]; then
            cp -f ./target/release/rustdesk-portable-packer.exe ./SignOutput/Boersis-Remote-Desktop-${{ inputs.build-profile }}-x86_64.exe
          elif [ -f "./libs/portable/target/release/rustdesk-portable-packer.exe" ]; then
            cp -f ./libs/portable/target/release/rustdesk-portable-packer.exe ./SignOutput/Boersis-Remote-Desktop-${{ inputs.build-profile }}-x86_64.exe
          fi
          ls -la ./SignOutput/

      - name: Upload Boersis Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: Boersis-Remote-Desktop-${{ inputs.build-profile }}-x86_64
          path: ./SignOutput/Boersis-Remote-Desktop-${{ inputs.build-profile }}-x86_64.exe
          if-no-files-found: error
