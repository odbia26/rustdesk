name: Build Windows EXE

on:
  workflow_dispatch:
    inputs:
      build-profile:
        description: 'Versión a compilar (cliente: solo entrante con PIN | operador: bidireccional completo)'
        required: true
        type: choice
        default: 'cliente'
        options:
          - cliente
          - operador
      upload-tag:
        description: 'Tag or version name'
        required: false
        default: 'custom'

jobs:
  run-windows-build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: ${{ inputs.upload-tag }}
      publish-update-metadata: false
      build-windows-only: true
      build-profile: ${{ inputs.build-profile }}
